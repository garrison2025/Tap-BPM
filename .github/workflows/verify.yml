name: Verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Validate preview noindex
        run: |
          grep -q 'Disallow: /' dist/robots.txt
          grep -q 'noindex' dist/index.html
